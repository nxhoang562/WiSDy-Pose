# Protocol 3 (all 27 activities), 30% random noise: Denoiser + Estimator.
# Hyperparameters: Table IV (Denoiser) and Table V (Estimator) of the paper.
seed: 0

data:
  protocol: protocol3
  split: random          # random (S1) | cross_subject (S2) | cross_environment (S3)
  train_ratio: 0.8        # S1: share of subjects used for training, per action
  split_seed: 42
  val_test_seed: 41       # held-out frames -> half validation, half test
  resize: [136, 32]       # 114 subcarriers x 10 packets -> 136 x 32 (nearest)
  noise_level: 0.3        # std of the injected N(0, 1) noise (0.1 = 10%)
  noise_seed: 0
  keypoint_dims: 2
  num_workers: 8

denoiser:
  n_kernels: [22, 151]
  kernel_sizes: [3, 3]
  pool_sizes: [2, 2]
  lr: 0.0002
  momentum: 0.5
  lr_constant_epochs: 45  # Eq. (5)
  batch_size: 256
  epochs: 100

estimator:                 # n_stacks = len(n_kernels)
  n_kernels: [16, 19, 101]
  kernel_sizes: [3, 2, 3]
  pool_sizes: [2, 2, 2]
  n_basis_kernels: 223
  temperature: 30
  dropout: 0.1346
  d_hidden: 64
  lr: 0.0059
  batch_size: 64
  epochs: 100
