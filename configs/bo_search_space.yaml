# Search space of the Bayesian optimisation (Section IV-D, Table III), used by bo_search.py.
# Continuous hyperparameters: log-uniform; discrete ones: uniform.
method: bayes
metric:
  name: estimator_val_loss
  goal: minimize

parameters:
  # Denoiser
  ae_batch_size: {values: [64, 128, 256, 512]}
  ae_epochs: {distribution: int_uniform, min: 20, max: 50}
  ae_lr: {distribution: log_uniform_values, min: 0.0001, max: 0.001}
  ae_momentum: {values: [0.5, 0.6, 0.7, 0.8, 0.9]}
  ae_n_kernels_1: {distribution: int_uniform, min: 16, max: 64}
  ae_n_kernels_2: {distribution: int_uniform, min: 32, max: 256}
  ae_kernel_size_1: {value: 3}
  ae_kernel_size_2: {value: 3}
  ae_maxpooling_1: {value: 2}
  ae_maxpooling_2: {value: 2}

  # Estimator (est_*_i is used only when n_stacks >= i)
  n_stacks: {values: [1, 2, 3]}
  est_batch_size: {values: [64, 128, 256, 512]}
  est_epochs: {distribution: int_uniform, min: 20, max: 100}
  est_lr: {distribution: log_uniform_values, min: 0.001, max: 0.01}
  est_dropout: {distribution: uniform, min: 0.1, max: 0.4}
  est_temp: {values: [30, 31, 32, 33]}
  est_n_basis_kernels: {distribution: int_uniform, min: 16, max: 256}
  est_n_kernels_1: {distribution: int_uniform, min: 8, max: 32}
  est_n_kernels_2: {distribution: int_uniform, min: 16, max: 64}
  est_n_kernels_3: {distribution: int_uniform, min: 64, max: 128}
  est_kernel_size_1: {distribution: int_uniform, min: 2, max: 3}
  est_kernel_size_2: {distribution: int_uniform, min: 2, max: 3}
  est_kernel_size_3: {distribution: int_uniform, min: 2, max: 3}
  est_maxpooling_1: {value: 2}
  est_maxpooling_2: {value: 2}
  est_maxpooling_3: {value: 2}
  est_d_hidden: {values: [32, 64, 128, 256]}
